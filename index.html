let lang=localStorage.getItem('chronoearth-lang')||((navigator.language||'en').slice(0,2));if(!I18N[lang])lang='en';
function tr(n){return I18N[lang][n]}
function eventTitle(d){const i=DATA.indexOf(d);return EVENT_TITLES[lang]?.[i]||d.title}
function translateUI(){document.documentElement.lang=lang;document.querySelector('h1 small').textContent=tr(14);document.getElementById('play').textContent=playing?'⏸ '+tr(1):'▶ '+tr(0);document.getElementById('now').textContent=tr(2);document.getElementById('search').placeholder=tr(3);document.getElementById('note').textContent=tr(9);document.querySelectorAll('#region option').forEach((o,i)=>o.textContent=tr(4+i));document.title='ChronoEarth – '+tr(14)}
const time=document.getElementById('time'),year=document.getElementById('year'),events=document.getElementById('events'),details=document.getElementById('details');let playing=null;
const globe=Globe()(document.getElementById('globe')).globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg').bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png').backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png').pointAltitude(.018).pointRadius(.28).pointColor(()=>'#e6b76c').pointLabel(d=>eventTitle(d)).onPointClick(show);
globe.controls().autoRotate=false;globe.pointOfView({lat:27,lng:20,altitude:2.5});
function label(y){return y<0?tr(11)+' '+(-y):tr(12)+' '+y}
function filtered(){const y=+time.value,q=document.getElementById('search').value.toLowerCase(),r=document.getElementById('region').value;return DATA.filter(d=>Math.abs(y-d.y)<=Math.max(25,Math.min(400,Math.abs(y)*.025))||(d.end!==undefined&&y>=d.y&&y<=d.end)).filter(d=>(!r||d.region===r)&&(!q||(d.title+' '+eventTitle(d)+' '+d.desc).toLowerCase().includes(q)))}
function show(d){details.style.display='block';details.innerHTML='<button style="float:right" id="close">✕</button><h2>'+d.title+'</h2><div style="color:#e6b76c">'+label(d.y)+(d.end?' – '+label(d.end):'')+'</div><p>'+d.desc+'</p><a href="'+d.src+'" target="_blank" rel="noopener">'+({en:'Historical source',de:'Historische Quelle',es:'Fuente histórica',fr:'Source historique',it:'Fonte storica',hu:'Történelmi forrás',pl:'Źródło historyczne'}[lang])+' ↗</a>';document.getElementById('close').onclick=()=>details.style.display='none';globe.pointOfView({lat:d.lat,lng:d.lng,altitude:1.25},900)}
function render(){year.textContent=label(+time.value);const a=filtered();globe.pointsData(a);events.innerHTML='';document.getElementById('count').textContent=a.length+' '+tr(10);a.forEach(d=>{const b=document.createElement('button');b.className='event';b.innerHTML='<strong>'+eventTitle(d)+'</strong><small>'+label(d.y)+' · '+tr(({Európa:5,Ázsia:6,Amerika:7,Afrika:8})[d.region])+'</small>';b.onclick=()=>show(d);events.appendChild(b)})}
time.oninput=render;document.getElementById('search').oninput=render;document.getElementById('region').onchange=render;document.getElementById('now').onclick=()=>{time.value=2026;render()};document.getElementById('play').onclick=()=>{const b=document.getElementById('play');if(playing){clearInterval(playing);playing=null;b.textContent='▶ '+tr(0)}else{playing=setInterval(()=>{let y=+time.value;y+=y<0?Math.max(1,Math.round(-y/100)):5;if(y>2026)y=-10000;time.value=y;render()},180);b.textContent='⏸ '+tr(1)}};window.addEventListener('resize',()=>globe.width(innerWidth).height(innerHeight));globe.width(innerWidth).height(innerHeight);document.getElementById('language').value=lang;document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('chronoearth-lang',lang);translateUI();render();details.style.display='none'};translateUI();render();
