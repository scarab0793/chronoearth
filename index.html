function render(){year.textContent=label(+time.value);document.getElementById('jumpyear').value=time.value;const y=+time.value;const selectedRegion=document.getElementById('region').value;const regionMatches=region=>!selectedRegion||region===selectedRegion;const visibleRoutes=document.getElementById('routes').checked?historicalRoutes.filter(d=>y>=d.from&&y<=d.to&&regionMatches(d.region)):[];const visibleCities=document.getElementById('cities').checked?historicalCities.filter(c=>y>=c.from&&y<=c.to&&regionMatches(c.region)):[];const visibleRegions=document.getElementById('borders').checked?historicalRegions.filter(f=>y>=f.properties.from&&y<=f.properties.to&&regionMatches(f.properties.region)):[];globe.pathsData(visibleRoutes);globe.labelsData(visibleCities);globe.polygonsData(visibleRegions);const a=filtered();const cv=COVERAGE_TEXT[lang];document.getElementById('coverage').innerHTML='<strong>'+cv[0]+': '+a.length+' · '+cv[1]+': '+visibleCities.length+' · '+cv[2]+': '+visibleRegions.length+' · '+cv[3]+': '+visibleRoutes.length+'</strong><small>'+cv[4]+'</small>';const q=document.getElementById('search').value.trim();const hasNearby=a.some(d=>Math.abs(y-d.y)<=Math.max(25,Math.min(400,Math.abs(y)*.025))||(d.end!==undefined&&y>=d.y&&y<=d.end));document.getElementById('modeinfo').textContent=q?({en:'Searches all periods',de:'Suche in allen Epochen',es:'Busca en todas las épocas',fr:'Recherche toutes les époques',it:'Ricerca in tutte le epoche',hu:'Keresés minden korszakban',pl:'Wyszukiwanie we wszystkich epokach'}[lang]):!hasNearby&&a.length?({en:'Nearest recorded events (not from selected year)',de:'Zeitlich nächste Ereignisse (nicht aus diesem Jahr)',es:'Eventos más cercanos (no del año elegido)',fr:'Événements les plus proches (pas de cette année)',it:'Eventi più vicini (non dell’anno selezionato)',hu:'Legközelebbi ismert események (nem a kiválasztott évből)',pl:'Najbliższe wydarzenia (nie z wybranego roku)'}[lang]):'';globe.pointsData(a);events.innerHTML='';document. const jumpyear=document.getElementById('jumpyear');function setYear(value){const n=Number(value);if(!Number.isInteger(n)||n < -10000||n > 2026)return false;time.value=n;render();return true}jumpyear.onchange=()=>{if(!setYear(jumpyear.value))jumpyear.value=time.value};jumpyear.onkeydown=e=>{if(e.key==='Enter'){jumpyear.blur()}};time.oninput=render;document.getElementById('search').oninput=render;document.getElementById('region').onchange=render;document.getElementById('now').onclick=()=>setYear(2026);document.getElementById('play').onclick=()=>{const b=document.getElementById('play');if(playing){clearInterval(playing);playing=null;b.textContent='▶ '+tr(0)}else{playing=setInterval(()=>{let y=+time.value;y+=y<0?Math.max(1,Math.round(-y/100)):5;if(y>2026)y=-10000;time.value=y;render()},180);b.textContent='⏸ '+tr(1)}};window.addEventListener('resize',()=>globe.width(innerWidth).height(innerHeight));globe.width(innerWidth).height(innerHeight);document.getElementById('share').onclick=()=>{const u=new URL(location.href);u.searchParams.set('year',time.value);u.searchParams.set('lang',lang);u.searchParams.set('region',document.getElementById('region').value);const value=u.toString();if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(()=>{document.getElementById('share').textContent='✓';setTimeout(()=>document.getElementById('share').textContent='🔗',1600)}).catch(()=>prompt('Copy link',value));else prompt('Copy link',value)};document.getElementById('borders').onchange=render;document.getElementById('cities').onchange=render;document.getElementById('routes').onchange=render;document.getElementById('language').value=lang;document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('chronoearth-lang',lang);translateUI();periodButtons();render();details.style.display='none'};const query=new URLSearchParams(location.search);if(query.has('lang')&&I18N[query.get('lang')]){lang=query.get('lang');document.getElementById('language').value=lang}if(query.has('year')){const n=Number(query.get('year'));if(Number.isInteger(n)&&n>=-10000&&n<=2026)time.value=n}if(query.has('region')&&['','Európa','Ázsia','Amerika','Afrika'].includes(query.get('region')))document.getElementById('region').value=query.get('region');translateUI();periodButtons();render();fetch('./data/routes-v1.json').then(r=>{if(!r.ok)throw Error('Routes unavailable');return r.json()}).then(j=>{historicalRoutes=j.routes||[];render()}).catch(console.warn);fetch('./data/cities-v1.json').then(r=>{if(!r.ok)throw Error('Cities unavailable');return r.json()}).then(j=>{historicalCities=j.cities||[];render()}).catch(console.warn);fetch('./data/regions-schematic.geojson').then(r=>{if(!r.ok)throw new Error('Regions unavailable');return r.json()}).then(j=>{historicalRegions=j.features||[];render()}).catch(console.warn);fetch('./data/events-v1.json').then(r=>{if(!r.ok)throw new Error('Dataset unavailable');return r.json()}).then(j=>{if(Array.isArray(j.events)){DATA.push(...j.events);render()}}).catch(e=>console.warn('Additional historical events unavailable:',e));
