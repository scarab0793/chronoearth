<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChronoEarth – Történelmi időgép</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06111f;color:#f0f4fb;font:14px system-ui,sans-serif;overflow:hidden}header{position:absolute;z-index:5;top:0;left:0;right:0;background:#091728ed;border-bottom:1px solid #32475b;padding:12px 20px}h1{font-size:21px;margin:0}h1 em{color:#e6b76c;font-style:normal}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.timeline{display:flex;align-items:center;gap:12px;margin-top:10px}.timeline input{flex:1;accent-color:#e6b76c}#year{font-size:18px;color:#e6b76c;min-width:120px;font-weight:bold}button,input,select{background:#152c43;color:white;border:1px solid #47617b;border-radius:8px;padding:8px;cursor:pointer}button:hover{background:#254660}main,#globe{height:100dvh;width:100vw}aside{position:absolute;top:125px;bottom:18px;left:16px;width:320px;background:#0b1b30e9;border:1px solid #30465f;border-radius:12px;z-index:4;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(8px)}.filters{padding:14px;border-bottom:1px solid #30465f}.filters input,.filters select{width:100%;margin:0 0 9px}.events{overflow:auto;padding:8px}.event{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #263a50;border-radius:0;padding:11px}.event small{display:block;color:#b5c7d9;margin-top:4px}.event strong{display:block}#details{position:absolute;right:18px;bottom:18px;width:min(340px,calc(100vw - 36px));z-index:4;background:#0b1b30ec;border:1px solid #30465f;border-radius:12px;padding:16px;display:none;line-height:1.55}#details h2{margin:0 0 6px;font-size:18px}#details a{color:#e6b76c}#note{position:absolute;right:16px;top:125px;z-index:3;color:#b5c7d9;background:#0b1b30a9;padding:8px;border-radius:8px;max-width:250px} @media(max-width:700px){header{padding:9px}.top{gap:5px}h1{font-size:16px}aside{top:auto;bottom:0;left:0;width:100%;height:31vh;border-radius:12px 12px 0 0}#details{bottom:32vh;right:6px;width:90%;font-size:12px}#note{display:none}.timeline{gap:5px}#year{min-width:90px;font-size:14px}}
</style></head><body><header><div class="top"><h1>🌍 <em>ChronoEarth</em> <small style="font-size:11px;color:#b5c7d9">Explore history in 3D</small></h1><div><button id="play">▶ Lejátszás</button> <button id="now">Ma</button></div></div><div class="timeline"><span id="year">Kr. e. 44</span><input id="time" type="range" min="-10000" max="2026" value="-44" step="1" aria-label="Év"><span>2026</span></div></header>
<main><div id="globe"></div><aside><div class="filters"><input id="search" type="search" placeholder="Keresés: Róma, maja, Kína…"><select id="region"><option value="">Minden térség</option><option>Európa</option><option>Ázsia</option><option>Amerika</option><option>Afrika</option></select><div id="count"></div></div><div class="events" id="events"></div></aside><div id="note">Forgatás: húzás · Nagyítás: görgő vagy két ujj · Kattints az eseményekre</div><div id="details"></div></main>
<script src="https://unpkg.com/globe.gl"></script><script>
const DATA=[
{y:-3100,end:-3000,title:"Korai egyiptomi állam kialakulása",lat:30.05,lng:31.23,region:"Afrika",desc:"Egyiptom politikai egyesülésének folyamata a korai dinasztikus korszak kezdetén.",src:"https://www.britannica.com/place/ancient-Egypt"},
{y:-2500,end:-2400,title:"Gízai piramisok kora",lat:29.979,lng:31.134,region:"Afrika",desc:"A nagy piramisok építésének időszaka az Óbirodalomban.",src:"https://www.britannica.com/topic/Pyramids-of-Giza"},
{y:-753,title:"Róma hagyományos alapítási dátuma",lat:41.89,lng:12.49,region:"Európa",desc:"A hagyomány szerint Róma alapításának éve; nem tekinthető régészetileg bizonyított pontos dátumnak.",src:"https://www.britannica.com/place/Rome"},
{y:-221,title:"Kína egyesítése a Qin-dinasztia alatt",lat:34.26,lng:108.94,region:"Ázsia",desc:"Qin Shi Huang uralma alatt a hadakozó államok nagy részének egyesítése.",src:"https://www.britannica.com/topic/Qin-dynasty"},
{y:-44,title:"Julius Caesar meggyilkolása",lat:41.895,lng:12.477,region:"Európa",desc:"Caesart Kr. e. 44. március 15-én Rómában megölték.",src:"https://www.britannica.com/biography/Julius-Caesar-Roman-ruler"},
{y:-100,end:250,title:"Maja preklasszikus városok virágzása",lat:17.76,lng:-89.92,region:"Amerika",desc:"A maja civilizáció több jelentős települése fejlődött ebben az időszakban. A dátumok hozzávetőlegesek.",src:"https://www.britannica.com/topic/Maya-people"},
{y:79,title:"A Vezúv kitörése és Pompeji pusztulása",lat:40.75,lng:14.49,region:"Európa",desc:"A Vezúv kitörése elpusztította Pompejit és Herculaneumot.",src:"https://www.britannica.com/place/Pompeii"},
{y:476,title:"A nyugatrómai császárság megszűnésének hagyományos dátuma",lat:44.06,lng:12.57,region:"Európa",desc:"Romulus Augustulust eltávolították a hatalomból. A folyamat nem egyetlen napon zajlott.",src:"https://www.britannica.com/event/fall-of-Rome"},
{y:800,title:"Nagy Károly császárrá koronázása",lat:41.9,lng:12.45,region:"Európa",desc:"Nagy Károlyt 800 karácsonyán Rómában császárrá koronázták.",src:"https://www.britannica.com/biography/Charlemagne"},
{y:1066,title:"Hastingsi csata",lat:50.91,lng:0.49,region:"Európa",desc:"Normann győzelem, amely megváltoztatta Anglia történelmét.",src:"https://www.britannica.com/event/Battle-of-Hastings"},
{y:1206,title:"Mongol Birodalom megalapítása",lat:47.92,lng:106.92,region:"Ázsia",desc:"Temüdzsint nagykánná választották; Dzsingisz kán néven vált ismertté.",src:"https://www.britannica.com/biography/Genghis-Khan"},
{y:1325,title:"Tenochtitlan hagyományos alapítási dátuma",lat:19.43,lng:-99.13,region:"Amerika",desc:"Az azték főváros alapításának hagyományos dátuma.",src:"https://www.britannica.com/place/Tenochtitlan"},
{y:1453,title:"Konstantinápoly eleste",lat:41.01,lng:28.98,region:"Európa",desc:"Az oszmán haderő elfoglalta Konstantinápolyt.",src:"https://www.britannica.com/event/Fall-of-Constantinople-1453"},
{y:1492,title:"Kolumbusz első útja Amerikába",lat:24.06,lng:-74.53,region:"Amerika",desc:"Kolumbusz expedíciója elérte a Bahama-szigetek térségét.",src:"https://www.britannica.com/biography/Christopher-Columbus"},
{y:1776,title:"Amerikai Függetlenségi Nyilatkozat",lat:39.95,lng:-75.15,region:"Amerika",desc:"A Függetlenségi Nyilatkozat elfogadása Philadelphiában.",src:"https://www.archives.gov/founding-docs/declaration"},
{y:1789,title:"A francia forradalom kezdete",lat:48.86,lng:2.35,region:"Európa",desc:"A Bastille ostroma a francia forradalom egyik jelképes eseménye.",src:"https://www.britannica.com/event/French-Revolution"},
{y:1914,title:"Az első világháború kezdete",lat:43.86,lng:18.41,region:"Európa",desc:"A szarajevói merényletet követő válság világháborúhoz vezetett.",src:"https://www.britannica.com/event/World-War-I"},
{y:1969,title:"Apollo–11 Holdra szállás",lat:28.57,lng:-80.65,region:"Amerika",desc:"Az Apollo–11 sikeres Holdra szállása; a földi jelölő a Kennedy Űrközpontot mutatja.",src:"https://www.nasa.gov/mission/apollo-11/"}
];
const time=document.getElementById('time'),year=document.getElementById('year'),events=document.getElementById('events'),details=document.getElementById('details');let playing=null;
const globe=Globe()(document.getElementById('globe')).globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg').bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png').backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png').pointAltitude(.018).pointRadius(.28).pointColor(()=>'#e6b76c').pointLabel(d=>d.title).onPointClick(show);
globe.controls().autoRotate=false;globe.pointOfView({lat:27,lng:20,altitude:2.5});
function label(y){return y<0?'Kr. e. '+(-y):'Kr. u. '+y}
function filtered(){const y=+time.value,q=document.getElementById('search').value.toLowerCase(),r=document.getElementById('region').value;return DATA.filter(d=>Math.abs(y-d.y)<=Math.max(25,Math.min(400,Math.abs(y)*.025))||(d.end!==undefined&&y>=d.y&&y<=d.end)).filter(d=>(!r||d.region===r)&&(!q||(d.title+' '+d.desc).toLowerCase().includes(q)))}
function show(d){details.style.display='block';details.innerHTML='<button style="float:right" id="close">✕</button><h2>'+d.title+'</h2><div style="color:#e6b76c">'+label(d.y)+(d.end?' – '+label(d.end):'')+'</div><p>'+d.desc+'</p><a href="'+d.src+'" target="_blank" rel="noopener">Történelmi forrás ↗</a>';document.getElementById('close').onclick=()=>details.style.display='none';globe.pointOfView({lat:d.lat,lng:d.lng,altitude:1.25},900)}
function render(){year.textContent=label(+time.value);const a=filtered();globe.pointsData(a);events.innerHTML='';document.getElementById('count').textContent=a.length+' megjelenített esemény · bemutató adatbázis';a.forEach(d=>{const b=document.createElement('button');b.className='event';b.innerHTML='<strong>'+d.title+'</strong><small>'+label(d.y)+' · '+d.region+'</small>';b.onclick=()=>show(d);events.appendChild(b)})}
time.oninput=render;document.getElementById('search').oninput=render;document.getElementById('region').onchange=render;document.getElementById('now').onclick=()=>{time.value=2026;render()};document.getElementById('play').onclick=()=>{const b=document.getElementById('play');if(playing){clearInterval(playing);playing=null;b.textContent='▶ Lejátszás'}else{playing=setInterval(()=>{let y=+time.value;y+=y<0?Math.max(1,Math.round(-y/100)):5;if(y>2026)y=-10000;time.value=y;render()},180);b.textContent='⏸ Szünet'}};window.addEventListener('resize',()=>globe.width(innerWidth).height(innerHeight));globe.width(innerWidth).height(innerHeight);render();
</script></body></html>
