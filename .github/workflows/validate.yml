name: Validate ChronoEarth data
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical datasets and inline JavaScript
        run: node scripts/validate-data.cjs
      - name: Validate imported historical records and provenance
        run: node scripts/validate-imports.cjs
      - name: Summarize historical import coverage by century
        run: node scripts/import-coverage-report.cjs
      - name: Summarize map coverage and unverified boundaries
        if: always()
        run: node scripts/map-coverage-report.cjs
      - name: Test checkpointed settlement importer (offline)
        run: node tests/fetch-wikidata-cities.test.cjs
      - name: Test shared import engine and battle importer (offline)
        run: node tests/fetch-wikidata-battles.test.cjs
      - name: Test historical capital importer (offline)
        run: node tests/fetch-wikidata-capitals.test.cjs
      - name: Smoke test Wikidata importer
        run: |
          node scripts/import-wikidata.cjs tests/fixtures/wikidata-sparql.json /tmp/chronoearth-wikidata-test.json
          node -e "const x=require('/tmp/chronoearth-wikidata-test.json');if(x.recordCount!==1||x.records[0].externalIds.wikidata!=='Q1748'||x.records[0].location.latitude!==41.012)process.exit(1)"
