name: Import Wikidata historical cities
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-wikidata.yml'
      - 'scripts/fetch-wikidata-cities.cjs'
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch historical entities from Wikidata
        run: node scripts/fetch-wikidata-cities.cjs
      - name: Validate imported JSON
        run: |
          node -e "const j=require('./data/imports/wikidata-cities.json');if(!Array.isArray(j.cities)||!j.cities.length)process.exit(1)"
          node scripts/validate-data.cjs
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imports/wikidata-cities.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Wikidata historical city records"
            git push
          fi
